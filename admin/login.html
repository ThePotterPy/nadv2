<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAD &mdash; Acceso restringido</title>
    <link rel="icon" type="image/png" href="/nad.png">
    <style>
        @font-face {
            font-family: 'MADE TOMMY';
            src: url('/tipografia/MADE TOMMY Thin_PERSONAL USE.otf') format('opentype');
            font-weight: 100;
            font-style: normal;
        }
        @font-face {
            font-family: 'MADE TOMMY';
            src: url('/tipografia/MADE TOMMY Light_PERSONAL USE.otf') format('opentype');
            font-weight: 300;
            font-style: normal;
        }
        @font-face {
            font-family: 'MADE TOMMY';
            src: url('/tipografia/MADE TOMMY Regular_PERSONAL USE.otf') format('opentype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'MADE TOMMY';
            src: url('/tipografia/MADE TOMMY Medium_PERSONAL USE.otf') format('opentype');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'MADE TOMMY';
            src: url('/tipografia/MADE TOMMY Bold_PERSONAL USE.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }
        @font-face {
            font-family: 'MADE TOMMY';
            src: url('/tipografia/MADE TOMMY ExtraBold_PERSONAL USE.otf') format('opentype');
            font-weight: 800;
            font-style: normal;
        }
        @font-face {
            font-family: 'MADE TOMMY';
            src: url('/tipografia/MADE TOMMY Black_PERSONAL USE.otf') format('opentype');
            font-weight: 900;
            font-style: normal;
        }

        :root {
            --primary: #BF0413;
            --primary-dark: #73030D;
            --accent: #F2C029;
            --bg: #F2DDB6;
            --font-main: 'MADE TOMMY', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-dark) 0%, #1a0305 50%, #0d0102 100%);
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 20% 50%, rgba(191,4,19,0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 80% 50%, rgba(242,192,41,0.05) 0%, transparent 60%);
        }
        .card {
            background: rgba(242,221,182,0.97);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(242,221,182,0.3);
            border-radius: 24px;
            padding: 3rem 2.5rem 2.5rem;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            position: relative;
            z-index: 1;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes slideUp {
            from { opacity:0; transform: translateY(30px) scale(0.97); }
            to   { opacity:1; transform: translateY(0) scale(1); }
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            justify-content: center;
        }
        .logo-img-wrap {
            background: var(--primary-dark);
            border-radius: 12px;
            padding: 6px 10px;
        }
        .logo img { height: 40px; object-fit: contain; display:block; }
        .logo-text .name { font-size: 1.15rem; font-weight: 800; color: var(--primary-dark); }
        .logo-text .sub  { font-size: 0.72rem; color: var(--primary); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
        h1 { font-size: 1.55rem; color: var(--primary-dark); margin-bottom: 0.4rem; text-align: center; font-weight: 800; }
        p.sub { text-align: center; color: #7a6040; margin-bottom: 2rem; font-size: 0.9rem; }
        .field { margin-bottom: 1.1rem; }
        label { display: block; font-weight: 700; color: var(--primary-dark); margin-bottom: 0.4rem; font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; }
        .input-wrap { position: relative; }
        input[type=text], input[type=password] {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            border: 2px solid rgba(115,3,13,0.15);
            border-radius: 12px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            background: white;
            color: #1a1a1a;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(191,4,19,0.08); }
        .input-icon {
            position: absolute; left: 0.9rem; top: 50%; transform: translateY(-50%);
            color: rgba(115,3,13,0.35); pointer-events: none;
        }
        .btn {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--bg);
            border: none;
            border-radius: 50px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.8rem;
            letter-spacing: 0.02em;
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(115,3,13,0.35); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .alert {
            padding: 0.85rem 1rem;
            border-radius: 12px;
            margin-bottom: 1.2rem;
            font-size: 0.88rem;
            display: none;
            align-items: flex-start;
            gap: 0.6rem;
        }
        .alert.show { display: flex; }
        .alert-error   { background: rgba(191,4,19,0.08); border: 1px solid rgba(191,4,19,0.2); color: #8b0000; }
        .alert-blocked { background: rgba(255,100,0,0.08); border: 1px solid rgba(255,100,0,0.2); color: #7c2d12; }
        .alert svg { flex-shrink:0; margin-top:1px; }
        .attempts-bar {
            display: flex; gap: 5px; margin-top: 0.6rem;
        }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: rgba(191,4,19,0.2);
            transition: background 0.3s;
        }
        .dot.used { background: var(--primary); }
        .divider { border:none; border-top:1px solid rgba(115,3,13,0.1); margin: 1.5rem 0 1.2rem; }
        .back { display: block; text-align: center; color: var(--primary-dark); font-size: 0.88rem; opacity: 0.5; text-decoration: none; transition: opacity 0.2s; }
        .back:hover { opacity: 0.9; }
        .lock-icon { text-align:center; margin-bottom:1rem; }
        .lock-icon svg { color: var(--primary); opacity:0.4; }
        .countdown { font-weight:800; color:var(--primary); }
        
        @media (max-width: 480px) {
            .card {
                padding: 2.2rem 1.5rem 1.8rem;
                margin: 1rem;
                border-radius: 20px;
                width: calc(100% - 2rem);
            }
            h1 { font-size: 1.35rem; }
            .logo-text .name { font-size: 1.05rem; }
            p.sub { font-size: 0.82rem; margin-bottom: 1.5rem; }
            .logo img { height: 34px; }
            input[type=text], input[type=password] { font-size: 0.95rem; padding: 0.8rem 1rem 0.8rem 2.6rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="lock-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>
        <div class="logo">
            <div class="logo-img-wrap"><img src="/nad.png" alt="NAD"></div>
            <div class="logo-text">
                <div class="name">NAD Constructora</div>
                <div class="sub">Panel de Administración</div>
            </div>
        </div>
        <h1>Acceso restringido</h1>
        <p class="sub">Solo personal autorizado. Ingresá tus credenciales.</p>

        <div class="alert alert-blocked" id="alert-blocked">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <div>Demasiados intentos fallidos. Panel bloqueado por <span class="countdown" id="countdown-text"></span> minutos.</div>
        </div>

        <div class="alert alert-error" id="alert-error">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            <div>
                <strong>Usuario o contraseña incorrectos.</strong>
                <div id="attempts-info" style="margin-top:0.4rem;font-size:0.82rem;opacity:0.8;display:none">
                    Intentos restantes: <strong id="remaining-num"></strong>
                    <div class="attempts-bar" id="attempts-dots"></div>
                </div>
            </div>
        </div>

        <form method="POST" id="login-form">
            <div class="field">
                <label for="username">Usuario</label>
                <div class="input-wrap">
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" id="username" name="username" placeholder="Ingresá tu usuario" required autocomplete="username">
                </div>
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <div class="input-wrap">
                    <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="btn" id="submit-btn">Ingresar al panel</button>
        </form>
        <hr class="divider">
        <a href="/" class="back">← Volver al sitio principal</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const error     = params.get('error');
        const remaining = parseInt(params.get('remaining'));
        const mins      = parseInt(params.get('mins'));

        if (error === 'blocked') {
            document.getElementById('alert-blocked').classList.add('show');
            document.getElementById('login-form').style.opacity = '0.4';
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('countdown-text').textContent = isNaN(mins) ? '15' : mins;
        } else if (error === '1') {
            document.getElementById('alert-error').classList.add('show');
            if (!isNaN(remaining) && remaining >= 0) {
                document.getElementById('attempts-info').style.display = 'block';
                document.getElementById('remaining-num').textContent = remaining;
                const dots = document.getElementById('attempts-dots');
                for (let i = 0; i < 5; i++) {
                    const d = document.createElement('div');
                    d.className = 'dot' + (i >= remaining ? ' used' : '');
                    dots.appendChild(d);
                }
            }
        }

        // Envío asíncrono seguro vía fetch para garantizar cabeceras de origen y evitar pantallas de error en crudo
        const form = document.getElementById('login-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.textContent = 'Verificando...';
            btn.disabled = true;

            const errAlert = document.getElementById('alert-error');
            if (errAlert) errAlert.classList.remove('show');

            const formData = new URLSearchParams(new FormData(form));
            try {
                const targetUrl = window.location.pathname + window.location.search;
                const res = await fetch(targetUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData.toString()
                });

                if (res.redirected) {
                    window.location.href = res.url;
                    return;
                }

                if (res.ok) {
                    const panelPath = window.location.pathname.replace(/\/login\/?$/, '');
                    window.location.href = panelPath || '/';
                    return;
                }

                // Si devolvió un error (400, 401, 403, etc.)
                const data = await res.json().catch(() => ({}));
                btn.textContent = 'Ingresar al panel';
                btn.disabled = false;

                if (errAlert) {
                    errAlert.classList.add('show');
                    const strong = errAlert.querySelector('strong');
                    if (strong && data.error) {
                        strong.textContent = data.error;
                    }
                }
            } catch (err) {
                // Si la red o el navegador bloquea fetch, fallback a submit estándar
                form.submit();
            }
        });
    </script>
</body>
</html>
